<!doctype html>
<html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#5b6cff"><title>课表管理后台</title>
<style>body{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;margin:0;padding:24px;background:linear-gradient(135deg,#eaf0ff,#f8f5ff);color:#18213d}main{max-width:1100px;margin:auto}.panel{background:#ffffffc9;border:1px solid #fff;border-radius:24px;padding:22px;margin:16px 0;box-shadow:0 12px 35px #5063a522;backdrop-filter:blur(18px)}h1{margin:0 0 6px}h2{margin:0 0 14px}.muted{color:#66708b}label{display:block;font-weight:700;margin:10px 0}input{display:block;width:100%;box-sizing:border-box;padding:12px;border:1px solid #cfd7ef;border-radius:12px;margin-top:6px;font-size:16px}button{border:0;border-radius:12px;padding:11px 16px;background:#5867f5;color:#fff;font-weight:700;cursor:pointer;margin:8px 6px 0 0}button.secondary{background:#e8ecff;color:#3f4cbc}button.danger{background:#dd5b6a}.hidden{display:none}.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(260px,1fr));gap:14px}.user-card,.event{background:#f6f7ff;border-radius:16px;padding:14px}.user-card pre{white-space:pre-wrap;max-height:280px;overflow:auto;font-size:12px}.stat{font-size:28px;font-weight:800}.toolbar{display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap}@media(max-width:600px){body{padding:12px}.panel{padding:16px;border-radius:18px}}</style></head>
<body><main><section class="panel"><h1>课表管理后台</h1><p class="muted">查看用户课表数据与系统运行日志。仅限 Admin 用户。</p><div id="login"><label>管理员用户 ID<input id="uid" value="Admin" autocomplete="username"></label><label>管理员密码<input id="pwd" type="password" autocomplete="current-password"></label><label>服务器地址<input id="endpoint" value="https://api.vincentlee.asia/class-table"></label><button id="loginBtn">登录管理后台</button><p id="loginMsg" class="muted"></p></div><div id="app" class="hidden"><div class="toolbar"><span id="updated" class="muted"></span><button id="refresh" class="secondary">刷新数据</button><button id="logout" class="danger">退出</button></div></div></section><section id="summaryPanel" class="panel hidden"><h2>日志汇总</h2><div id="summary" class="grid"></div></section><section id="usersPanel" class="panel hidden"><h2>用户课表</h2><div id="users" class="grid"></div></section><section id="eventsPanel" class="panel hidden"><h2>运行日志（最多 500 条）</h2><div id="events" class="grid"></div></section></main>
<script>
(()=>{let token='',endpoint='';const $=id=>document.getElementById(id);function msg(t){$('loginMsg').textContent=t}function headers(){return {'X-User-Id':'Admin','Authorization':'Bearer '+token}}async function load(){try{const r=await fetch(endpoint+'/v1/admin/overview',{headers:headers()});const d=await r.json();if(!r.ok)throw Error(d.message||'加载失败');$('updated').textContent='更新于 '+new Date(d.generatedAt).toLocaleString();$('summary').innerHTML=d.summary.length?d.summary.map(x=>`<div class="user-card"><div class="stat">${x.count}</div><div>${escapeHtml(x.event)}</div></div>`).join(''):'<p class="muted">暂无统计</p>';$('users').innerHTML=d.users.map(u=>`<article class="user-card"><h3>${escapeHtml(u.userId)}</h3><p>版本：${u.revision} · 更新：${u.timetableUpdatedAt||'暂无'}</p><p>课程数：${Array.isArray(u.state?.courses)?u.state.courses.length:0}</p><details><summary>查看课表 JSON</summary><pre>${escapeHtml(JSON.stringify(u.state,null,2))}</pre></details></article>`).join('')||'<p class="muted">暂无用户</p>';$('events').innerHTML=d.events.map(e=>`<div class="event"><b>${escapeHtml(e.eventType)}</b><br><span>${escapeHtml(e.message)}</span><br><small>${escapeHtml(e.userId)} · ${escapeHtml(e.createdAt)}</small></div>`).join('')||'<p class="muted">暂无运行日志</p>';$('summaryPanel').classList.remove('hidden');$('usersPanel').classList.remove('hidden');$('eventsPanel').classList.remove('hidden')}catch(e){msg(e.message)}}function escapeHtml(s){return String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}$('loginBtn').onclick=async()=>{endpoint=$('endpoint').value.trim().replace(/\/$/,'');const r=await fetch(endpoint+'/v1/auth/login',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({userId:$('uid').value.trim(),password:$('pwd').value})});const d=await r.json().catch(()=>({}));if(!r.ok){msg(d.message||'登录失败');return}token=d.token;$('login').classList.add('hidden');$('app').classList.remove('hidden');await load()};$('refresh').onclick=load;$('logout').onclick=()=>location.reload()})();
</script></body></html>
