services:
  class-table-api:
    build: .
    restart: unless-stopped
    environment:
      PORT: "8080"
      CLASS_TABLE_DB: /data/class-table.sqlite3
      CLASS_TABLE_CORS_ORIGIN: https://class.vincentlee.asia
      CLASS_TABLE_BOOTSTRAP_KEY: ${CLASS_TABLE_BOOTSTRAP_KEY}
      VAPID_PUBLIC_KEY: ${VAPID_PUBLIC_KEY}
      VAPID_PRIVATE_KEY: ${VAPID_PRIVATE_KEY}
      VAPID_PRIVATE_KEY_B64: ${VAPID_PRIVATE_KEY_B64}
      VAPID_SUBJECT: ${VAPID_SUBJECT}
    volumes:
      - ./data:/data
    ports:
      - "127.0.0.1:18110:8080"
